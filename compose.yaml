services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run demo:up to create private local configuration}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
    ports:
      - '127.0.0.1:${APP_PORT:-3100}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 15s

  verify:
    profiles: [verification]
    build:
      context: .
      target: verify
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
      ALLOW_DATABASE_TESTS: '1'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
